<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Soil Buddies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-warm: #FAF8F3;
      --soil-brown: #4A3728;
      --olive-green: #6B7F4E;
      --soft-clay: #C9A27E;
    }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--soil-brown);
      background-color: var(--bg-warm);
    }
    h1, h2, h3 { font-family: 'Lora', serif; }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(74, 55, 40, 0.08); }
    ::-moz-selection { background: #C9A27E; color: white; }
    ::selection { background: #C9A27E; color: white; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  
  <!-- Background Decoration -->
  <div class="absolute top-0 right-0 w-1/2 h-full bg-[#C9A27E]/10 -z-10 rounded-l-full blur-3xl"></div>
  <div class="absolute bottom-0 left-0 w-1/3 h-1/2 bg-[#6B7F4E]/5 -z-10 rounded-tr-full blur-3xl"></div>

  <div class="w-full max-w-md bg-white rounded-3xl p-10 custom-shadow border border-[#4A3728]/5 z-10">
    <!-- Logo & Header -->
    <div class="flex flex-col items-center mb-10">
      <div class="w-12 h-12 rounded-full bg-[#6B7F4E] flex items-center justify-center mb-4">
        <iconify-icon icon="lucide:leaf" class="text-white text-2xl"></iconify-icon>
      </div>
      <h1 class="text-3xl font-medium text-center">Welcome Back</h1>
      <p class="text-sm text-[#4A3728]/70 mt-2">Log in to manage your soil health.</p>
    </div>

    <!-- Login Form -->
    <form action="/login" method="POST" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium mb-2">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <iconify-icon icon="lucide:mail" class="text-[#4A3728]/40 text-lg"></iconify-icon>
          </div>
          <input type="email" id="email" name="email" required class="w-full pl-11 pr-4 py-3 rounded-xl bg-[#FAF8F3] border border-[#4A3728]/10 focus:outline-none focus:ring-2 focus:ring-[#6B7F4E]/40 transition-all" placeholder="farmer@email.com">
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label for="password" class="block text-sm font-medium">Password</label>
          <a href="#" class="text-xs font-semibold text-[#6B7F4E] hover:underline">Forgot password?</a>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <iconify-icon icon="lucide:lock" class="text-[#4A3728]/40 text-lg"></iconify-icon>
          </div>
          <input type="password" id="password" name="password" required class="w-full pl-11 pr-4 py-3 rounded-xl bg-[#FAF8F3] border border-[#4A3728]/10 focus:outline-none focus:ring-2 focus:ring-[#6B7F4E]/40 transition-all" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="w-full py-4 bg-[#6B7F4E] hover:bg-[#5a6b41] text-white rounded-xl font-medium transition-all transform hover:-translate-y-0.5 shadow-lg shadow-[#6B7F4E]/20">
        Log In
      </button>
    </form>

    <div class="mt-8 text-center text-sm">
      <p class="text-[#4A3728]/70">Don't have an account? <a href="/register" class="font-semibold text-[#4A3728] hover:text-[#6B7F4E] transition-colors">Sign up</a></p>
    </div>
    
    <div class="mt-6 text-center">
      <a href="/" class="text-xs text-[#4A3728]/50 hover:text-[#4A3728] flex items-center justify-center gap-1 transition-colors">
        <iconify-icon icon="lucide:arrow-left"></iconify-icon> Back to home
      </a>
    </div>
  </div>
</body>
</html>
