<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Soil Buddies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-warm: #FAF8F3;
      --soil-brown: #4A3728;
      --olive-green: #6B7F4E;
      --soft-clay: #C9A27E;
    }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--soil-brown);
      background-color: var(--bg-warm);
    }
    h1, h2, h3 { font-family: 'Lora', serif; }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(74, 55, 40, 0.08); }
    ::-moz-selection { background: #C9A27E; color: white; }
    ::selection { background: #C9A27E; color: white; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  
  <!-- Background Decoration -->
  <div class="absolute top-0 left-0 w-1/2 h-full bg-[#6B7F4E]/5 -z-10 rounded-r-full blur-3xl"></div>

  <div class="w-full max-w-md bg-white rounded-3xl p-10 custom-shadow border border-[#4A3728]/5 z-10">
    <!-- Logo & Header -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-full bg-[#C9A27E] flex items-center justify-center mb-4">
        <iconify-icon icon="lucide:sprout" class="text-white text-2xl"></iconify-icon>
      </div>
      <h1 class="text-3xl font-medium text-center">Create Account</h1>
      <p class="text-sm text-[#4A3728]/70 mt-2">Join to start tracking your farm's health.</p>
    </div>

    <!-- Registration Form -->
    <form action="/register" method="POST" class="space-y-5">
      <div>
        <label for="fullname" class="block text-sm font-medium mb-2">Full Name or Farm Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <iconify-icon icon="lucide:user" class="text-[#4A3728]/40 text-lg"></iconify-icon>
          </div>
          <input type="text" id="fullname" name="fullname" required class="w-full pl-11 pr-4 py-3 rounded-xl bg-[#FAF8F3] border border-[#4A3728]/10 focus:outline-none focus:ring-2 focus:ring-[#6B7F4E]/40 transition-all" placeholder="e.g. Trish man">
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium mb-2">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <iconify-icon icon="lucide:mail" class="text-[#4A3728]/40 text-lg"></iconify-icon>
          </div>
          <input type="email" id="email" name="email" required class="w-full pl-11 pr-4 py-3 rounded-xl bg-[#FAF8F3] border border-[#4A3728]/10 focus:outline-none focus:ring-2 focus:ring-[#6B7F4E]/40 transition-all" placeholder="farmer@email.com">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-2">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <iconify-icon icon="lucide:lock" class="text-[#4A3728]/40 text-lg"></iconify-icon>
          </div>
          <input type="password" id="password" name="password" required class="w-full pl-11 pr-4 py-3 rounded-xl bg-[#FAF8F3] border border-[#4A3728]/10 focus:outline-none focus:ring-2 focus:ring-[#6B7F4E]/40 transition-all" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="w-full py-4 mt-2 bg-[#4A3728] hover:bg-[#32251a] text-white rounded-xl font-medium transition-all transform hover:-translate-y-0.5 shadow-lg shadow-[#4A3728]/20">
        Sign Up
      </button>
    </form>

    <div class="mt-8 text-center text-sm">
      <p class="text-[#4A3728]/70">Already have an account? <a href="/login" class="font-semibold text-[#6B7F4E] hover:text-[#5a6b41] transition-colors">Log in</a></p>
    </div>
  </div>
</body>
</html>
